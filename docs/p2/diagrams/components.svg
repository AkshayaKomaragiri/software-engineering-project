<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1312" height="488" viewBox="0 0 1312 488" role="img" aria-labelledby="component-view-title component-view-description">
  <title id="component-view-title">Rep Rank UML component view</title>
  <desc id="component-view-description">Eight components lie inside Rep Rank. Supabase Auth and Supabase Database are external. A socket uses a named capability supplied by the same-named ball. Workout Interaction is offered to the user.</desc>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; fill: #162333; }
    .boundary { fill: #f3f7fa; stroke: #537085; stroke-width: 1.6; }
    .zone-name { font-size: 19px; font-weight: 650; fill: #204961; }
    .zone-detail { font-size: 15px; fill: #435467; }
    .card { fill: #fff; stroke: #59758b; stroke-width: 1.3; }
    .divider, .component-icon { stroke: #59758b; stroke-width: 1.2; fill: #fff; }
    .component { font-size: 18px; font-weight: 650; }
    .capability { font-size: 16.5px; }
    .provided { stroke: #285773; stroke-width: 1.9; fill: #fff; }
    .required { stroke: #414d5a; stroke-width: 1.8; fill: none; }
    .external .card { fill: #fffaf2; stroke: #826440; }
    .external .divider, .external .component-icon { stroke: #826440; fill: #fffaf2; }
    .external-link { fill: none; stroke: #826440; stroke-width: 1.7; }
    .legend { font-size: 15.5px; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" markerWidth="7" markerHeight="7" refX="7" refY="4" orient="auto">
      <path d="M1 1l6 3-6 3" fill="none" stroke="#826440" stroke-width="1.15"/>
    </marker>
  </defs>
  <rect width="1312" height="488" fill="#fff"/>
  <g id="rep-rank-boundary">
