    <text class="zone-name" x="22" y="37">Rep Rank</text>
    <text class="zone-detail" x="117" y="37">Mobile app boundary</text>
  </g>
  <g id="external-services-label">
    <text class="zone-name" x="1051" y="37">External services</text>
  </g>
  <g id="external-dependencies">
    <path class="external-link" d="M1000 156H1051" marker-end="url(#arrow)"/>
    <path class="external-link" d="M1000 387H1051" marker-end="url(#arrow)"/>
  </g>
